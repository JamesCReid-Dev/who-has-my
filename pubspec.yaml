name: whohasmy
description: A cross-platform lending tracker that helps you track items loaned to friends, family, or colleagues.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI & Media
  image_picker: ^1.0.7
  
  # Email Notifications
  flutter_email_sender: ^6.0.3
  
  # Background Tasks (Platform-specific)
  workmanager: ^0.5.2  # Android only
  flutter_local_notifications: ^17.2.2  # iOS/macOS only
  
  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  # Code Generation
  build_runner: ^2.4.8
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  
  # Assets (reserved for future use)
  # assets:
  #   - assets/images/